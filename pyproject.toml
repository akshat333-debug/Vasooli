[project]
name = "vasooli"
version = "0.1.0"
description = "Bounded subscription-recovery sequencer. Treats mandate retries as a regulated, three-attempt budget."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "runfuse[openai]>=0.1",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Kept for `pip install -e ".[dev]"`, which CI uses. The dependency-group below
# is the one that makes a bare `uv run pytest` work on a clean clone.
dev = ["pytest>=8.0", "coverage>=7.6", "hypothesis>=6.100", "ruff>=0.6"]
razorpay = ["razorpay>=1.4"]

# PEP 735. `uv run` installs the `dev` group automatically; an extra is NOT
# installed unless asked for. Without this, a fresh clone running the command
# the README prints -- `uv run pytest` -- fell through to whatever pytest was
# on PATH, which has neither this package nor hypothesis, and reported 17
# collection errors. CI never caught it because CI installs the extra by name.
[dependency-groups]
dev = ["pytest>=8.0", "coverage>=7.6", "hypothesis>=6.100", "ruff>=0.6"]

[project.scripts]
vasooli = "vasooli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# DTZ001: naive datetimes are deliberate here. Batch times are fixed reference
# points chosen for reproducibility, not wall-clock instants — a timezone would
# add ambiguity to a value whose whole purpose is to be identical on every run.
# The one real timestamp (ledger row time) does use timezone-aware UTC.
ignore = ["DTZ001", "C408", "RUF015"]

[tool.coverage.run]
source = ["vasooli"]
omit = ["vasooli/cli.py"]

[tool.coverage.report]
# cli.py is argument plumbing and print statements, exercised end to end by the
# CI "batch runs end to end" step rather than by unit tests. Everything that
# makes a decision about money is in scope here.
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
